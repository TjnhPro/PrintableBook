<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printable Book</title>
  <link rel="icon" type="image/png" href="assets/printable-book-logo.png">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/book-workspace.css">
</head>
<body class="pb-app-shell bg-[var(--pb-canvas)] font-sans text-[var(--pb-ink)] antialiased" data-theme="light">
  <div class="pb-app-canvas">
    <aside class="pb-sidebar flex flex-col border-r border-[var(--pb-border)] bg-[var(--pb-surface)] px-3 py-5">
      <div class="pb-brand"><img class="pb-brand-logo" src="assets/printable-book-logo.png" width="36" height="36" alt="" aria-hidden="true"><span><span class="pb-brand-name">Printable Book</span><span class="pb-brand-version">Version 0.1</span></span></div>
      <nav class="space-y-1" aria-label="Primary navigation">
        <button data-route="books" class="nav-item nav-item-active"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16.5A1.5 1.5 0 0 0 18.5 18H6a2 2 0 0 0-2 2V5.5Z"/><path d="M6 3v15"/></svg><span>Books</span></button><button data-route="process" class="nav-item"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="5"/></svg><span>Process</span></button><button data-route="outputs" class="nav-item"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5M9 13h6M9 17h6"/></svg><span>PDF Library</span></button><button data-route="brands" class="nav-item"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V8l8-5 8 5v12"/><path d="M8 20v-6h8v6M9 9h.01M15 9h.01"/></svg><span>Brands &amp; templates</span></button>
      </nav>
      <div class="my-5 border-t border-[var(--pb-border)]"></div>
      <nav class="space-y-1" aria-label="Supporting navigation"><button data-route="configuration" class="nav-item"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1 2.2-2 1.2-1.9-1a7 7 0 0 1-1.8 1L13.2 21h-2.4l-.6-2.6a7 7 0 0 1-1.8-1l-1.9 1-2-1.2.1-2.2a7 7 0 0 1-.9-1.8l-2.2-.5V10l2.2-.5a7 7 0 0 1 .9-1.8l-.1-2.2 2-1.2 1.9 1a7 7 0 0 1 1.8-1l.6-2.6h2.4l.6 2.6a7 7 0 0 1 1.8 1l1.9-1 2 1.2-.1 2.2a7 7 0 0 1 .9 1.8l2.2.5v2.4l-2.2.5a7 7 0 0 1-.9 1.8Z"/></svg><span>Settings</span></button><button data-route="diagnostics" class="nav-item"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v4M12 17h.01"/></svg><span>Diagnostics</span></button></nav>
      <div class="mt-auto rounded-lg border border-slate-200 bg-slate-50 p-3 text-xs text-slate-500"><p class="font-medium text-slate-700">Desktop bridge</p><p id="bridge-status" class="mt-1" role="status">Connecting…</p></div>
    </aside>
    <div class="pb-main"><header class="sticky top-0 z-10 flex h-16 items-center justify-between border-b border-[var(--pb-border)] bg-[color:var(--pb-surface)/.95] px-8 backdrop-blur"><div><p class="text-sm font-semibold">Printable Book</p><p id="page-subtitle" class="text-xs text-[var(--pb-muted)]">Book library</p></div><div class="flex items-center gap-3"><button id="global-process-status" class="global-process-status" data-route="process" type="button" aria-live="polite"><span class="status-dot"></span><span>Nothing processing</span></button><label class="text-xs font-medium text-slate-600" for="brand-select">Brand</label><select id="brand-select" class="control w-44"><option>Loading brands…</option></select><button id="refresh-button" class="button-secondary">Refresh</button></div></header>
      <main id="app-content" class="pb-content" aria-live="polite"><section class="space-y-6"><div><p class="eyebrow">Book Library</p><h1 class="mt-1 text-2xl font-semibold tracking-tight">Your local KDP production desk</h1><p class="mt-2 text-sm text-slate-500">Refresh to discover Book folders and prepare Interior artwork.</p></div></section></main>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
