name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Restore
        run: dotnet restore PrintableBook.sln

      - name: Build
        run: dotnet build PrintableBook.sln --configuration Release --no-restore

      - name: Run Core tests
        run: dotnet test tests/PrintableBook.Core.Tests/PrintableBook.Core.Tests.csproj --configuration Release --no-build

      - name: Run UpdateSecurity tests
        run: dotnet test tests/PrintableBook.UpdateSecurity.Tests/PrintableBook.UpdateSecurity.Tests.csproj --configuration Release --no-build

      - name: Run repository-owned Infrastructure integration tests
        run: dotnet test tests/PrintableBook.Infrastructure.Tests/PrintableBook.Infrastructure.Tests.csproj --configuration Release --no-build --filter "TestScope!=LocalCorpus"

      - name: Run Updater tests
        run: dotnet test tests/PrintableBook.Updater.Tests/PrintableBook.Updater.Tests.csproj --configuration Release --no-build

      - name: Run Desktop tests
        run: dotnet test tests/PrintableBook.Desktop.Tests/PrintableBook.Desktop.Tests.csproj --configuration Release --no-build

      - name: Run ReleaseTool tests
        run: dotnet test tests/PrintableBook.ReleaseTool.Tests/PrintableBook.ReleaseTool.Tests.csproj --configuration Release --no-build

      - name: Run frontend bridge tests
        run: node --test tests/PrintableBook.Desktop.Bridge.Tests/app-bridge.test.mjs

      - name: Run production UI contract tests
        run: node src/PrintableBook.Desktop/Frontend/test-production-ui.mjs

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag '$tag' must match vM.m.p."
          }
          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package signed portable artifact
        shell: pwsh
        env:
          PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY)) {
            throw "PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY is not configured."
          }
          ./scripts/publish-release.ps1 -ExpectedVersion "${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/release/*.zip
            artifacts/release/*.zip.sha256
            artifacts/release/*.manifest.json
            artifacts/release/*.manifest.json.sig
