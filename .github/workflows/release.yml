name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag '$tag' must match vM.m.p."
          }
          $version = $tag.Substring(1)
          $desktopVersion = (dotnet msbuild src/PrintableBook.Desktop/PrintableBook.Desktop.csproj -nologo -getProperty:Version).Trim()
          $updaterVersion = (dotnet msbuild src/PrintableBook.Updater/PrintableBook.Updater.csproj -nologo -getProperty:Version).Trim()
          if ($desktopVersion -ne $version -or $updaterVersion -ne $version) {
            throw "Release tag '$tag' does not match Desktop/Updater version '$desktopVersion/$updaterVersion'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package signed portable artifact
        shell: pwsh
        env:
          PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY)) {
            throw "PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY is not configured."
          }
          ./scripts/publish-release.ps1 -ExpectedVersion "${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/release/*.zip
            artifacts/release/*.zip.sha256
            artifacts/release/*.manifest.json
            artifacts/release/*.manifest.json.sig
