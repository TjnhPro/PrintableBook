name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Checkout main candidate
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Run canonical full verification
        shell: pwsh
        run: ./scripts/test-keyword-workflow.ps1 -Full

      - name: Read candidate version
        id: version
        shell: pwsh
        run: |
          $version = (& dotnet msbuild src/PrintableBook.Desktop/PrintableBook.Desktop.csproj -nologo -getProperty:Version).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Desktop Version is empty."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package signed release candidate
        shell: pwsh
        env:
          PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY)) {
            throw "PRINTABLEBOOK_UPDATE_SIGNING_PRIVATE_KEY is not configured."
          }
          ./scripts/publish-release.ps1 -ExpectedVersion "${{ steps.version.outputs.version }}"

      - name: Upload signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: PrintableBook-${{ steps.version.outputs.version }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/release/PrintableBook-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/release/PrintableBook-${{ steps.version.outputs.version }}-win-x64.zip.sha256
            artifacts/release/PrintableBook-${{ steps.version.outputs.version }}-win-x64.manifest.json
            artifacts/release/PrintableBook-${{ steps.version.outputs.version }}-win-x64.manifest.json.sig
